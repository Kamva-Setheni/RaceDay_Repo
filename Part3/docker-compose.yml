# Starts the RaceDay web application in a container with one command:
#   docker compose up --build
# The RaceDay API (Part 2) and Azurite keep running on the host machine.
services:
  web:
    build: ./RaceDay.Web
    image: raceday-web
    ports:
      - "8080:8080"
    environment:
      ApiBaseUrl: http://host.docker.internal:5003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
